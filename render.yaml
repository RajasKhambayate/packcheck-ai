# Render Blueprint — enables "New + > Blueprint" one-click deploy on Render.com
# Push this repo to GitHub, then in Render: New -> Blueprint -> pick this repo.
# Render will provision the Postgres DB, backend web service and frontend
# static/web service automatically from this file.

databases:
  - name: packcheck-db
    plan: free
    databaseName: packcheck
    user: packcheck

services:
  - type: web
    name: packcheck-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: packcheck-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ENV
        value: production

  - type: web
    name: packcheck-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_BASE
        value: /api
